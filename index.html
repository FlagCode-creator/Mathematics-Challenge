              <button id="toggleReturnedDebtsBtnPublic" class="px-4 py-2 rounded-xl font-bold btn-hover text-sm" style="font-family:${CONFIG.font_family};background-color:${showReturnedDebts?CONFIG.accent_color:CONFIG.surface_color};color:${showReturnedDebts?'white':CONFIG.text_color};border:2px solid ${CONFIG.accent_color};">
                ${showReturnedDebts ? '🙈 ซ่อนที่คืนแล้ว' : '👁️ แสดงที่คืนแล้ว'}
              </button>
            </div>
          </div>
          <div class="space-y-3">
            ${filteredDebts.length===0
              ? `<p class="text-center py-10 opacity-50" style="font-family:${CONFIG.font_family};color:${CONFIG.text_color};">ไม่พบลูกหนี้ในหมวดที่เลือก</p>`
              : filteredDebts.slice((debtCurrentPage-1)*DEBT_PAGE_SIZE, debtCurrentPage*DEBT_PAGE_SIZE).map(d => renderDebtCard(d, false)).join('')}
          </div>
          ${filteredDebts.length > 0 ? renderDebtPagination(filteredDebts.length, 'Public') : ''}
        </div>` : renderDebtOverviewLocked();

  return `
    <div class="w-full h-full" style="background-color:${CONFIG.background_color};">
      ${renderHeader(false)}
      <main class="max-w-7xl mx-auto px-3 md:px-6 py-4 md:py-6">
        ${renderStatusSummary(false)}

        <div class="rounded-2xl p-4 md:p-6 shadow-lg mb-6" style="background-color:${CONFIG.surface_color};">
          <div class="flex flex-wrap justify-between items-center gap-4 mb-5">
            <div>
              <h2 class="font-bold flex items-center gap-2" style="font-family:${CONFIG.font_family};font-size:${CONFIG.font_size*1.3}px;color:${CONFIG.text_color};">📋 สถานะเอกสาร (${filteredDocs.length})</h2>
              <p class="text-sm mt-1" style="font-family:${CONFIG.font_family};color:${CONFIG.text_color};opacity:.7;">${getFilterStatusText(docFilterType,docFilterDate,docFilterMonth)}</p>
            </div>
            ${renderDocFilter('Public')}
          </div>
          <div class="space-y-2">
            ${filteredDocs.length===0
              ? `<p class="text-center py-10 opacity-50" style="font-family:${CONFIG.font_family};color:${CONFIG.text_color};">ไม่พบเอกสารในช่วงที่เลือก</p>`
              : filteredDocs.slice((docCurrentPage-1)*DOC_PAGE_SIZE, docCurrentPage*DOC_PAGE_SIZE).map(d => renderDocRow(d, false)).join('')}
          </div>
          ${filteredDocs.length > 0 ? renderDocPagination(filteredDocs.length, 'Public') : ''}
        </div>

        ${debtSection}
      </main>
    </div>`;
}

// ============================================================
// MAIN RENDER & EVENT ATTACHMENT
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (currentScreen === 'welcome') {
    app.innerHTML = renderWelcome();
    attachWelcomeHandlers();
  } else if (currentScreen === 'staff') {
    app.innerHTML = renderStaffDashboard();
    attachStaffHandlers();
    renderPendingBar();
  } else if (currentScreen === 'public') {
    app.innerHTML = renderPublicView();
    attachPublicHandlers();
  }
}

// ─── Filter Handlers (shared) ─────────────────────────────
function attachDocFilterHandlers(suffix='') {
  const typeEl  = document.getElementById('docFilterType'  + suffix);
  const dateEl  = document.getElementById('docFilterDate'  + suffix);
  const monthEl = document.getElementById('docFilterMonth' + suffix);
  if (!typeEl) return;
  typeEl.onchange = e => {
    docFilterType = e.target.value;
    dateEl.classList.toggle('hidden',  docFilterType !== 'daily');
    monthEl.classList.toggle('hidden', docFilterType !== 'monthly');
    docCurrentPage = 1;
    render();
  };
  dateEl.onchange  = e => { docFilterDate  = e.target.value; docCurrentPage = 1; render(); };
  monthEl.onchange = e => { docFilterMonth = e.target.value; docCurrentPage = 1; render(); };
}

function attachDebtFilterHandler(id) {
  const el = document.getElementById(id);
  if (el) el.onchange = e => { debtFilterType = e.target.value; debtCurrentPage = 1; render(); };
}

// ตัวกรองงบ (มีทั้งหน้า staff และ public)
function attachDebtBudgetFilterHandler() {
  ['debtBudgetFilterSel', 'debtBudgetFilterSelPublic'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onchange = e => { debtBudgetFilter = e.target.value; debtCurrentPage = 1; render(); };
  });
}

// dropdown แก้งบของลูกหนี้ (staff) — อัปเดตในเครื่องทันที ไม่ต้องโหลดใหม่ทั้งหมด
function attachDebtBudgetEditHandlers() {
  document.querySelectorAll('.update-debt-budget').forEach(sel => {
    sel.onchange = async e => {
      const rec = allRecords.find(r => r.__backendId === e.target.dataset.id);
      if (!rec) return;
      const newBudget = e.target.value;
      e.target.disabled = true;
      const res = await GAS.update({ ...rec, budget: newBudget, updated_at: new Date().toISOString() });
      if (res.ok) {
        showToast('✅ เปลี่ยนหมวดงบแล้ว');
        rec.budget = newBudget; rec.updated_at = new Date().toISOString();
        debts = sortDebts_(debts);
        render();
      } else { showToast('❌ เกิดข้อผิดพลาด', 'error'); e.target.disabled = false; }
    };
  });
}

function attachReturnedDebtsToggle(btnId) {
  const btn = document.getElementById(btnId);
  if (btn) btn.onclick = () => {
    showReturnedDebts = !showReturnedDebts;
    debtCurrentPage = 1;
    render();
    showToast(showReturnedDebts ? '💳 แสดงลูกหนี้ที่คืนแล้วด้วย' : '🙈 ซ่อนลูกหนี้ที่คืนแล้ว');
  };
}

function attachDebtPaginationHandlers(suffix='') {
  const prevBtn = document.getElementById('debtPrevBtn' + suffix);
  const nextBtn = document.getElementById('debtNextBtn' + suffix);
  if (prevBtn) prevBtn.onclick = () => {
    if (debtCurrentPage > 1) { debtCurrentPage--; render(); }
  };
  if (nextBtn) nextBtn.onclick = () => {
    const totalPages = Math.max(1, Math.ceil(filterDebts(debts).length / DEBT_PAGE_SIZE));
    if (debtCurrentPage < totalPages) { debtCurrentPage++; render(); }
  };
}

function attachArchivedToggle() {
  const btn = document.getElementById('toggleArchivedBtn');
  if (btn) btn.onclick = () => {
    showArchived = !showArchived;
    if (showArchived && docStatusFilter === 6) docStatusFilter = null;
    docCurrentPage = 1;
    render();
    showToast(showArchived ? '🗂️ แสดงเอกสารที่จัดเก็บแล้วด้วย' : '🙈 ซ่อนเอกสารที่จัดเก็บแล้ว');
  };
}

function attachStatusCategoryBtns(selector) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.onclick = () => {
      const statusId = parseInt(btn.dataset.status);
      if (docStatusFilter === statusId) {
        docStatusFilter = null;
      } else {
        docStatusFilter = statusId;
      }
      docCurrentPage = 1;
      render();
      const count = filterDocuments(documents).length;
      if (docStatusFilter === null) {
        showToast(`📊 แสดงเอกสารทั้งหมด ${count} รายการ`);
      } else {
        showToast(`📊 ${STATUS_OPTIONS.find(s=>s.id===statusId).name} ทั้งหมด ${count} รายการ`);
      }
    };
  });
}

function attachDocRowClickHandlers() {
  document.querySelectorAll('.doc-row-click').forEach(row => {
    row.onclick = e => {
      if (e.target.closest('select') || e.target.closest('button')) return;
      const id = row.dataset.id;
      const doc = allRecords.find(r => r.__backendId === id);
      if (doc) showDocDetail(doc);
    };
  });
}

function attachDocPaginationHandlers(suffix='') {
  const prevBtn = document.getElementById('docPrevBtn' + suffix);
  const nextBtn = document.getElementById('docNextBtn' + suffix);
  if (prevBtn) prevBtn.onclick = () => {
    if (docCurrentPage > 1) { docCurrentPage--; render(); }
  };
  if (nextBtn) nextBtn.onclick = () => {
    const totalPages = Math.max(1, Math.ceil(filterDocuments(documents).length / DOC_PAGE_SIZE));
    if (docCurrentPage < totalPages) { docCurrentPage++; render(); }
  };
}

// ─── Pending Changes Bar ──────────────────────────────────
function renderPendingBar() {
  const count = Object.keys(pendingDocChanges).length;
  const existing = document.getElementById('pendingBar');
  if (count === 0) { if (existing) existing.remove(); return; }
  if (existing) existing.remove();

  const bar = document.createElement('div');
  bar.id = 'pendingBar';
  bar.className = 'fixed bottom-6 left-1/2 z-50 card-animate';
  bar.style.cssText = 'transform:translateX(-50%);';
  bar.innerHTML = `
    <div class="flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl" style="background:linear-gradient(135deg,${CONFIG.primary_color},${CONFIG.accent_color});min-width:320px;">
      <div class="flex-1">
        <p class="font-black text-white" style="font-family:${CONFIG.font_family};font-size:${CONFIG.font_size}px;">
          ✏️ มี ${count} เอกสารรอบันทึก
        </p>
        <p class="text-white opacity-80 text-xs" style="font-family:${CONFIG.font_family};">กด "บันทึกทั้งหมด" เพื่ออัปเดตพร้อมกัน</p>
      </div>
      <button id="cancelPendingBtn" class="px-4 py-2 rounded-xl font-bold btn-hover" style="font-family:${CONFIG.font_family};font-size:${CONFIG.font_size*.9}px;background-color:rgba(255,255,255,.2);color:white;">ยกเลิก</button>
      <button id="savePendingBtn" class="px-5 py-2 rounded-xl font-bold btn-hover" style="font-family:${CONFIG.font_family};font-size:${CONFIG.font_size*.9}px;background-color:white;color:${CONFIG.primary_color};">💾 บันทึกทั้งหมด</button>
    </div>`;
  document.body.appendChild(bar);

  document.getElementById('cancelPendingBtn').onclick = () => {
    pendingDocChanges = {};
    renderPendingBar();
    render();
    showToast('↩️ ยกเลิกการเปลี่ยนแปลงแล้ว');
  };

  document.getElementById('savePendingBtn').onclick = async () => {
    const btn = document.getElementById('savePendingBtn');
    btn.innerHTML = '<span class="spinner" style="border-top-color:'+CONFIG.primary_color+';border-color:rgba(0,0,0,.15);"></span>กำลังบันทึก...';
    btn.disabled = true;

    const entries = Object.entries(pendingDocChanges);
    let successCount = 0;
    let failCount = 0;
    const now = new Date().toISOString();

    const succeeded = [];
    await Promise.all(entries.map(async ([id, newStatus]) => {
      const rec = allRecords.find(r => r.__backendId === id);
      if (!rec) return;
      // silent:true = ไม่ให้ push ทีละอัน (จะยิงสรุปรวมครั้งเดียวหลังบันทึกเสร็จ)
      const res = await GAS.update({ ...rec, status: newStatus, updated_at: now, silent: true });
      if (res.ok) { successCount++; succeeded.push([id, newStatus]); }
      else failCount++;
    }));

    pendingDocChanges = {};
    renderPendingBar();

    if (failCount === 0) showToast(`✅ บันทึกสำเร็จ ${successCount} รายการ`);
    else showToast(`⚠️ สำเร็จ ${successCount} / ล้มเหลว ${failCount} รายการ`, 'error');

    // ─── ยิง push "สรุปรวมครั้งเดียว" สำหรับเอกสารที่เปลี่ยนสำเร็จ (แบบ A) ───
    if (succeeded.length > 0) {
      let pushMsg;
      if (succeeded.length === 1) {
        const [id, st] = succeeded[0];
        const doc = allRecords.find(r => r.__backendId === id);
        const sName = (STATUS_OPTIONS.find(o => o.id === st) || {}).name || '';
        pushMsg = (doc ? doc.document_number : '') + ' ➜ ' + sName;
      } else {
        const nums = succeeded
          .map(([id]) => { const d = allRecords.find(r => r.__backendId === id); return d ? d.document_number : ''; })
          .filter(Boolean);
        const shown = nums.slice(0, 2).join(', ');
        pushMsg = 'อัปเดตสถานะ ' + succeeded.length + ' เอกสาร (' + shown +
                  (nums.length > 2 ? ' และอีก ' + (nums.length - 2) + ' รายการ' : '') + ')';
      }
      GAS.sendPush({ title: '🔔 อัปเดตสถานะเอกสาร', message: pushMsg }); // ยิงแล้วไม่ต้องรอ (ไม่หน่วง UI)
    }

    if (failCount > 0) {
      await refreshData(); // มีบางรายการล้มเหลว โหลดใหม่ให้ตรงกับเซิร์ฟเวอร์
    } else {
      // ทุกอย่างสำเร็จ → อัปเดตในเครื่อง ไม่ต้องโหลดใหม่ (เร็วขึ้น ~4 วิ)
      succeeded.forEach(([id, newStatus]) => {
        const r = allRecords.find(x => x.__backendId === id);
        if (r) { r.status = newStatus; r.updated_at = now; }
        statusHistory.push({ document_id: id, status: newStatus, changed_at: now });
      });
      documents = sortDocuments_(documents);
      render();
    }
  };
}

function startClock() {
  if (clockInterval) clearInterval(clockInterval);
  updateClock();
  clockInterval = setInterval(updateClock, 1000);
}

// ─── Welcome ──────────────────────────────────────────────
function attachWelcomeHandlers() {
  document.querySelectorAll('.ann-card').forEach(card => {
    card.onclick = () => {
      const ann = announcements.find(a => a.__id === card.dataset.id);
      if (ann && ann.file_url) showAnnouncementViewer(ann);
    };
  });

  document.getElementById('viewPublicBtn').onclick = () => {
    document.getElementById('menuSection').classList.add('hidden');
    document.getElementById('passcodeSection').classList.remove('hidden');
    document.getElementById('publicPasscode').value = '';
    document.getElementById('passcodeError').classList.add('hidden');
    document.getElementById('publicPasscode').focus();
  };
  document.getElementById('backFromPasscodeBtn').onclick = () => {
    document.getElementById('passcodeSection').classList.add('hidden');
    document.getElementById('menuSection').classList.remove('hidden');
    document.getElementById('passcodeError').classList.add('hidden');
  };
  document.getElementById('doPasscodeBtn').onclick = async () => {
    const code = document.getElementById('publicPasscode').value.trim();
    const errEl = document.getElementById('passcodeError');
    if (!code) { errEl.classList.remove('hidden'); return; }

    const btn = document.getElementById('doPasscodeBtn');
    const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังตรวจสอบ...';

    authCredential = { code: code };      // แนบรหัสไปให้ GAS ตรวจ — หน้าเว็บไม่รู้ว่ารหัสถูกหรือผิดเอง
    const res = await GAS.checkAuth();     // เซิร์ฟเวอร์เป็นผู้บอกว่ารหัสนี้ได้ระดับไหน
    btn.disabled = false; btn.innerHTML = orig;

    if (res.ok && res.level === 'full') {
      publicAccessLevel = 'full';
      currentScreen = 'public';
      render();
      refreshData('full'); // ดึงข้อมูลใหม่เสมอ กันข้อมูลระดับก่อนหน้าตกค้าง
    } else if (res.ok && res.level === 'basic') {
      publicAccessLevel = 'basic';
      currentScreen = 'public';
      render();
      refreshData('basic'); // เซิร์ฟเวอร์จะไม่ส่งรายละเอียดลูกหนี้มาเลยในระดับนี้
    } else {
      authCredential = null;              // รหัสผิด (หรือเชื่อมต่อไม่ได้) — ล้างทิ้ง
      errEl.classList.remove('hidden');
    }
  };
  document.getElementById('publicPasscode').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('doPasscodeBtn').click();
  };
  document.getElementById('loginStaffBtn').onclick = () => {
    document.getElementById('menuSection').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
  };
  document.getElementById('backBtn').onclick = () => {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('menuSection').classList.remove('hidden');
    document.getElementById('loginError').classList.add('hidden');
  };
  document.getElementById('doLoginBtn').onclick = async () => {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const errEl = document.getElementById('loginError');

    const btn = document.getElementById('doLoginBtn');
    const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';

    authCredential = { user: user, pass: pass }; // ส่งบัญชีให้ GAS ตรวจ — หน้าเว็บไม่เก็บรหัสเจ้าหน้าที่ไว้เลย
    const res = await GAS.checkAuth();
    btn.disabled = false; btn.innerHTML = orig;

    if (res.ok && res.level === 'staff') {
      currentScreen = 'staff';
      render();
      refreshData('full'); // เจ้าหน้าที่ต้องเห็นข้อมูลเต็มรูปแบบเสมอ
    } else {
      authCredential = null;
      errEl.classList.remove('hidden');
    }
  };
  document.getElementById('password').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
  };
}

// ─── Staff ────────────────────────────────────────────────
function attachStaffHandlers() {
  startClock();
  attachStatusCategoryBtns('.status-category-btn');
  attachDocFilterHandlers('');
  attachDocPaginationHandlers('');
  attachDocRowClickHandlers();
  attachArchivedToggle();
  attachDebtFilterHandler('debtFilter');
  attachDebtBudgetFilterHandler();
  attachDebtBudgetEditHandlers();
  attachDebtPaginationHandlers('');
  attachReturnedDebtsToggle('toggleReturnedDebtsBtn');

  document.getElementById('logoutBtn').onclick = () => {
    clearInterval(clockInterval);
    pendingDocChanges = {};
    authCredential = null; // ล้างสิทธิ์ออกเมื่อออกจากระบบ
    currentScreen = 'welcome';
    render();
    refreshData('welcome'); // อัปเดตตัวเลขสรุปหน้าแรกใหม่ กันตัวเลขค้างจากตอนแก้ไขข้อมูล
  };

  document.getElementById('summaryBtn').onclick    = () => showSummaryModal();
  document.getElementById('budgetBtn').onclick     = () => showBudgetModal();
  const upBtn = document.getElementById('budgetUploadBtn'), upFile = document.getElementById('budgetFile');
  if (upBtn && upFile) {
    upBtn.onclick = () => upFile.click();
    upFile.onchange = e => { const f = e.target.files[0]; if (f) handleBudgetUpload_(f); e.target.value = ''; };
  }
  document.getElementById('manageAnnBtn').onclick  = () => showAnnManageModal();
  document.getElementById('importDataBtn').onclick = () => {
    showToast('🔄 กำลังรีเฟรชข้อมูล...');
    refreshData().then(() => showToast('✅ รีเฟรชข้อมูลสำเร็จ'));
  };

  document.getElementById('docSubmit').onclick = async () => {
    const num    = document.getElementById('docNum').value.trim();
    const sender = document.getElementById('docSender').value.trim();
    const title  = document.getElementById('docTitle').value.trim();
    const item   = document.getElementById('docItem').value.trim();
    if (!num || !sender || !title || !item) { showToast('❌ กรุณากรอกข้อมูลให้ครบ', 'error'); return; }
    const btn = document.getElementById('docSubmit');
    btn.innerHTML = '<span class="spinner"></span>กำลังเพิ่ม...';
    btn.disabled  = true;
    const dateVal = document.getElementById('docDate').value;
    const docDate = dateVal ? new Date(dateVal + 'T00:00:00').toISOString() : new Date().toISOString();
    const res = await GAS.create({
      type: 'document', document_number: num, sender, title, item,
      status: parseInt(document.getElementById('docStatus').value),
      created_at: docDate, updated_at: new Date().toISOString()
    });
    btn.innerHTML = '➕ เพิ่มเอกสาร'; btn.disabled = false;
    if (res.ok) {
      showToast('✅ เพิ่มเอกสารสำเร็จ');
      ['docNum','docSender','docTitle','docItem','docDate'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('docStatus').value = '1';
      // อัปเดตในเครื่อง ไม่ต้องโหลดใหม่ทั้งหมด (เร็วขึ้น ~4 วิ)
      if (res.data) {
        allRecords.push(res.data);
        documents = sortDocuments_(documents.concat([res.data]));
        statusHistory.push({ document_id: res.data.__backendId, status: res.data.status, changed_at: res.data.created_at });
      }
      render();
    } else { showToast('❌ เกิดข้อผิดพลาด: ' + res.error, 'error'); }
  };

  document.getElementById('debtReturned').onchange = e => {
    const rf = document.getElementById('returnDateField');
    rf.classList.toggle('hidden', !e.target.checked);
    if (e.target.checked) document.getElementById('returnDate').value = new Date().toISOString().split('T')[0];
    else document.getElementById('returnDate').value = '';
  };

  document.getElementById('debtSubmit').onclick = async () => {
    const contract  = document.getElementById('contract').value.trim();
    const name      = document.getElementById('debtName').value.trim();
    const item      = document.getElementById('debtItem').value.trim();
    const amount    = document.getElementById('amount').value;
    const borrowDate= document.getElementById('borrowDate').value;
    const dueDate   = document.getElementById('dueDate').value;
    if (!contract || !name || !item || !amount || !borrowDate || !dueDate) {
      showToast('❌ กรุณากรอกข้อมูลให้ครบ', 'error'); return;
    }
    const btn = document.getElementById('debtSubmit');
    btn.innerHTML = '<span class="spinner"></span>กำลังเพิ่ม...'; btn.disabled = true;
    const isReturned  = document.getElementById('debtReturned').checked;
    const returnDate  = isReturned ? document.getElementById('returnDate').value : '';
    const budget = document.getElementById('debtBudget').value;
    const res = await GAS.create({
      type: 'debt', contract_number: contract, name, item,
      amount: parseFloat(amount), borrow_date: borrowDate, due_date: dueDate,
      returned: isReturned, return_date: returnDate, note: '', budget: budget,
      created_at: new Date().toISOString(), updated_at: new Date().toISOString()
    });
    btn.innerHTML = '➕ เพิ่มลูกหนี้'; btn.disabled = false;
    if (res.ok) {
      showToast('✅ เพิ่มลูกหนี้สำเร็จ');
      ['contract','debtName','debtItem','amount','borrowDate','dueDate','returnDate'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('debtReturned').checked = false;
      document.getElementById('returnDateField').classList.add('hidden');
      // อัปเดตในเครื่อง ไม่ต้องโหลดใหม่ทั้งหมด (เร็วขึ้น ~4 วิ)
      if (res.data) { allRecords.push(res.data); debts = sortDebts_(debts.concat([res.data])); }
      render();
    } else { showToast('❌ เกิดข้อผิดพลาด: ' + res.error, 'error'); }
  };

  document.querySelectorAll('.update-doc-status').forEach(sel => {
    sel.onchange = e => {
      const id = e.target.dataset.id;
      const rec = allRecords.find(r => r.__backendId === id);
      if (!rec) return;
      const newStatus = parseInt(e.target.value);
      if (newStatus === rec.status) {
        delete pendingDocChanges[id];
      } else {
        pendingDocChanges[id] = newStatus;
      }
      const s = STATUS_OPTIONS.find(o => o.id === newStatus);
      e.target.style.borderColor = pendingDocChanges[id] !== undefined ? '#f59e0b' : (s ? s.color : CONFIG.primary_color);
      renderPendingBar();
    };
  });

  document.querySelectorAll('.delete-doc').forEach(btn => {
    btn.onclick = e => {
      const rec = allRecords.find(r => r.__backendId === e.target.dataset.id);
      if (!rec) return;
      showConfirm(`ต้องการลบเอกสาร "${rec.title}" ใช่หรือไม่?`, async () => {
        const res = await GAS.delete(rec);
        if (res.ok) {
          delete pendingDocChanges[rec.__backendId];
          renderPendingBar();
          showToast('✅ ลบสำเร็จ');
          allRecords = allRecords.filter(r => r.__backendId !== rec.__backendId);
          documents  = documents.filter(r => r.__backendId !== rec.__backendId);
          statusHistory = statusHistory.filter(h => h.document_id !== rec.__backendId);
          render();
        }
        else showToast('❌ เกิดข้อผิดพลาด', 'error');
      });
    };
  });

  document.querySelectorAll('.update-debt-status').forEach(sel => {
    sel.onchange = async e => {
      const rec = allRecords.find(r => r.__backendId === e.target.dataset.id);
      if (!rec) return;
      const returned = e.target.value === 'true';
      let returnDate = rec.return_date || '';
      if (returned && !returnDate) returnDate = new Date().toISOString().split('T')[0];
      else if (!returned) returnDate = '';
      e.target.disabled = true;
      const res = await GAS.update({ ...rec, returned, return_date: returnDate, updated_at: new Date().toISOString() });
      if (res.ok) {
        showToast('✅ อัปเดตสำเร็จ');
        rec.returned = returned; rec.return_date = returnDate; rec.updated_at = new Date().toISOString();
        debts = sortDebts_(debts);
        render();
      }
      else { showToast('❌ เกิดข้อผิดพลาด', 'error'); e.target.disabled = false; }
    };
  });

  document.querySelectorAll('.delete-debt').forEach(btn => {
    btn.onclick = e => {
      const rec = allRecords.find(r => r.__backendId === e.target.dataset.id);
      if (!rec) return;
      showConfirm(`ต้องการลบลูกหนี้ "${rec.name}" ใช่หรือไม่?`, async () => {
        const res = await GAS.delete(rec);
        if (res.ok) {
          showToast('✅ ลบสำเร็จ');
          allRecords = allRecords.filter(r => r.__backendId !== rec.__backendId);
          debts      = debts.filter(r => r.__backendId !== rec.__backendId);
          render();
        }
        else showToast('❌ เกิดข้อผิดพลาด', 'error');
      });
    };
  });
}

// ─── Public ───────────────────────────────────────────────
function attachPublicHandlers() {
  startClock();
  attachStatusCategoryBtns('.status-category-btn-public');
  attachDocFilterHandlers('Public');
  attachDocPaginationHandlers('Public');
  attachDocRowClickHandlers();
  attachArchivedToggle();
  attachDebtFilterHandler('debtFilterPublic');
  attachDebtBudgetFilterHandler();
  attachDebtPaginationHandlers('Public');
  attachReturnedDebtsToggle('toggleReturnedDebtsBtnPublic');
  document.getElementById('backHomeBtn').onclick = () => { clearInterval(clockInterval); authCredential = null; currentScreen = 'welcome'; render(); refreshData('welcome'); };
  const sb = document.getElementById('summaryBtn');
  if (sb) sb.onclick = () => showSummaryModal();
  const bb = document.getElementById('budgetBtn');
  if (bb) bb.onclick = () => showBudgetModal();
}

// ============================================================
// INIT
// ============================================================
async function init() {
  render(); // แสดงหน้า Welcome ก่อน ไม่ block

  try {
    // หน้าแรกก่อนกรอกรหัสใดๆ: ขอแค่ตัวเลขสรุป + ประกาศ ไม่ขอรายละเอียดเอกสาร/ลูกหนี้เลย
    // (ป้องกันไม่ให้ข้อมูลลูกหนี้รายบุคคลถูกส่งมาที่เบราว์เซอร์ก่อนมีการยืนยันสิทธิ์)
    await refreshData('welcome');
  } catch(e) {
    console.warn('Init data load failed:', e);
  }

  // โหลดงบประมาณล่าสุดที่เจ้าหน้าที่เคยอัปโหลด (ถ้ามี) แล้ววาดใหม่ — ไม่ block หน้าแรก
  try {
    const res = await GAS.getBudget();
    if (res && res.ok && res.budget && res.budget.cats && res.budget.cats.length) {
      BUDGET_SUMMARY = res.budget;
      render();
    }
  } catch(e) { console.warn('Load budget failed:', e); }
}

init();

// ─── ลงทะเบียน Service Worker (PWA) ───
// ⚠️ ถ้าเปิด OneSignal ต้อง "ปล่อยให้ OneSignal เป็นคนลงทะเบียน sw.js เอง" (มันจะแนบ ?appId ที่จำเป็น)
// ถ้าเราลงทะเบียนเองก่อน OneSignal จะลงทะเบียน worker ตัวเองไม่ได้ → subscribe ไม่ได้
// จึงลง PWA worker เองเฉพาะตอน "ไม่ได้ใช้ OneSignal" เท่านั้น
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    if (ONESIGNAL_APP_ID) return; // ใช้ OneSignal → ให้มันลงทะเบียน sw.js เอง (sw.js มี PWA cache + push ในตัวเดียว)
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed:', err));
  });
}

// ============================================================
// OneSignal Web Push — ช่องทางแจ้งเตือนแยกจาก LINE (ยิงทันทีเมื่อมีเอกสารใหม่/เปลี่ยนสถานะ)
// ------------------------------------------------------------
// App ID "ไม่ใช่ความลับ" ใส่ในหน้าเว็บได้ (ส่วน REST Key ที่เป็นความลับอยู่ฝั่ง GAS)
// เว้นว่าง = ปิด web push (เว็บยังทำงานปกติทุกอย่าง)
// ⚠️ ใช้ Service Worker ตัวเดียวกับ PWA (sw.js) เพื่อไม่ให้ worker ชนกัน
// ============================================================
const ONESIGNAL_APP_ID = '933c2a67-a565-4bcd-99cc-feaf90db110a'; // App ID จาก OneSignal (ไม่ลับ)
window.OneSignalDeferred = window.OneSignalDeferred || [];
if (ONESIGNAL_APP_ID) {
  window.OneSignalDeferred.push(async function(OneSignal) {
    // ล้าง service worker เก่าที่เราเคยลงทะเบียนเอง (ไม่มี ?appId) ในโฟลเดอร์นี้
    // เพื่อให้ OneSignal ลงทะเบียน sw.js ของมันเอง (แนบ ?appId) ได้สะอาด — จำเป็นต่อการ subscribe
    try {
      const dirScope = new URL('./', location.href).href;
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        if (r.scope === dirScope && r.active && r.active.scriptURL.indexOf('appId') === -1) {
          await r.unregister();
        }
      }
    } catch (e) {}

    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      serviceWorkerPath: 'sw.js',          // ใช้ SW เดียวกับ PWA (sw.js มี importScripts ของ OneSignal อยู่แล้ว)
      serviceWorkerParam: { scope: './' }, // scope เท่ากับโฟลเดอร์ของเว็บ — รองรับทั้ง project page และ custom domain
      allowLocalhostAsSecureOrigin: true
    });
    setupPushButton(OneSignal); // ปุ่มลอยให้ผู้ใช้กดเปิด/ปิดแจ้งเตือนเอง
  });
}

// ─── ปุ่มลอย "เปิดแจ้งเตือน" (มุมขวาล่าง) ───
// แสดงเฉพาะอุปกรณ์ที่รองรับ web push (บน iPhone จะขึ้นเฉพาะตอนติดตั้งเป็นแอปแล้วเปิดจากไอคอน)
function setupPushButton(OneSignal) {
  try { if (!OneSignal.Notifications.isPushSupported()) return; } catch(e) { return; }
  if (document.getElementById('pushToggleBtn')) return;

  const btn = document.createElement('button');
  btn.id = 'pushToggleBtn';
  btn.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:45;padding:11px 16px;border-radius:9999px;border:none;color:#fff;font-family:Sarabun,sans-serif;font-weight:700;font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;';
  document.body.appendChild(btn);

  function isOn() {
    try { return OneSignal.Notifications.permission && OneSignal.User.PushSubscription.optedIn; }
    catch(e) { return false; }
  }
  function refresh() {
    const on = isOn();
    btn.textContent = on ? '🔔 แจ้งเตือนเปิดอยู่' : '🔔 เปิดแจ้งเตือน';
    btn.style.background = on ? '#10b981' : 'linear-gradient(135deg,#2563eb,#0ea5e9)';
  }
  refresh();

  btn.onclick = async () => {
    btn.disabled = true;
    try {
      if (isOn()) {
        await OneSignal.User.PushSubscription.optOut();
        showToast('🔕 ปิดแจ้งเตือนแล้ว');
      } else {
        await OneSignal.Notifications.requestPermission();
        await OneSignal.User.PushSubscription.optIn();
        if (OneSignal.Notifications.permission) showToast('✅ เปิดแจ้งเตือนสำเร็จ');
        else showToast('❌ เบราว์เซอร์ปฏิเสธการแจ้งเตือน (ตั้งค่าอนุญาตใหม่ได้)', 'error');
      }
    } catch(e) {
      showToast('❌ ' + e, 'error');
    }
    btn.disabled = false;
    refresh();
  };

  try {
    OneSignal.Notifications.addEventListener('permissionChange', refresh);
    OneSignal.User.PushSubscription.addEventListener('change', refresh);
  } catch(e) {}
}
</script>
